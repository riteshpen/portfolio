<script>
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (!('IntersectionObserver' in window)) return;

  var css = `
  .fx-caret::after{content:"";display:inline-block;width:.08em;height:.9em;margin-left:3px;background:var(--teal);vertical-align:-.08em;animation:fxblink .8s steps(1) infinite}
  @keyframes fxblink{50%{opacity:0}}

  .fx-pop{opacity:0;transform:translateY(26px) scale(.95)}
  .fx-pop.fx-in{opacity:1;transform:none;transition:opacity .5s ease var(--d,0s),transform .75s cubic-bezier(.34,1.56,.64,1) var(--d,0s)}

  .fx-li{opacity:0;transform:translateX(-14px)}
  .fx-li.fx-in{opacity:1;transform:none;transition:opacity .45s ease var(--d,0s),transform .6s cubic-bezier(.34,1.56,.64,1) var(--d,0s)}

  .scatter .dot{transform:scale(0);transform-box:fill-box;transform-origin:center}
  .chart-block.in-view .dot{transform:scale(1);transition:opacity .4s ease,transform .6s cubic-bezier(.34,1.8,.64,1)}

  .fx-progress{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:50;
    background:linear-gradient(90deg,var(--teal),var(--amber));transform:scaleX(0);transform-origin:0 50%}
  `;
  var st = document.createElement('style');
  st.textContent = css;
  document.head.appendChild(st);

  /* ---------- Typewriter ---------- */
  function prep(el) {
    var text = el.textContent.trim();
    el.style.minHeight = el.offsetHeight + 'px';
    el.textContent = '';
    return text;
  }
  function type(el, text, speed, done) {
    var i = 0;
    el.classList.add('fx-caret');
    (function tick() {
      el.textContent = text.slice(0, ++i);
      if (i < text.length) {
        setTimeout(tick, speed + Math.random() * speed * 0.7);
      } else {
        if (done) done();
        setTimeout(function () { el.classList.remove('fx-caret'); }, 1800);
      }
    })();
  }
  function stopCaret(el) { el.classList.remove('fx-caret'); }

  // Hero: eyebrow -> name -> lede, one after another
  var eyebrow = document.querySelector('.eyebrow');
  var h1 = document.querySelector('h1');
  var lede = document.querySelector('.hero-lede');
  if (eyebrow && h1 && lede) {
    var t1 = prep(eyebrow), t2 = prep(h1), t3 = prep(lede);
    setTimeout(function () {
      type(eyebrow, t1, 22, function () {
        stopCaret(eyebrow);
        type(h1, t2, 70, function () {
          stopCaret(h1);
          type(lede, t3, 11);
        });
      });
    }, 350);
  }

  // Section headings type themselves when scrolled into view
  var headIO = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      headIO.unobserve(e.target);
      type(e.target, e.target.dataset.fx, 55);
    });
  }, { threshold: 0.8 });
  document.querySelectorAll('.section-head h2').forEach(function (h) {
    h.dataset.fx = prep(h);
    headIO.observe(h.parentNode.firstElementChild === h ? h : h);
  });

  /* ---------- Popups ---------- */
  var popIO = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.add('fx-in');
      popIO.unobserve(e.target);
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
  document.querySelectorAll('.exp, .project').forEach(function (el) {
    el.classList.add('fx-pop');
    popIO.observe(el);
  });

  // Bullet lists slide in one by one
  var liIO = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.querySelectorAll('.fx-li').forEach(function (li, i) {
        li.style.setProperty('--d', (0.15 + i * 0.12) + 's');
        li.classList.add('fx-in');
      });
      liIO.unobserve(e.target);
    });
  }, { threshold: 0.3 });
  document.querySelectorAll('.star-list, .exp-list').forEach(function (ul) {
    ul.querySelectorAll('li').forEach(function (li) { li.classList.add('fx-li'); });
    liIO.observe(ul);
  });

  // Scatter dots pop in one after another
  document.querySelectorAll('.scatter .dot').forEach(function (d, i) {
    d.style.transitionDelay = (0.2 + i * 0.09) + 's';
  });

  // Metric numbers count up
  var countIO = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      countIO.unobserve(e.target);
      var el = e.target, n = +el.dataset.n, suf = el.dataset.suf, t0 = performance.now(), dur = 1100;
      (function step(t) {
        var p = Math.min(1, (t - t0) / dur), eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(n * eased) + suf;
        if (p < 1) requestAnimationFrame(step);
      })(t0);
    });
  }, { threshold: 0.6 });
  document.querySelectorAll('.metric-val').forEach(function (el) {
    var m = el.textContent.trim().match(/^(\d+)(.*)$/);
    if (!m) return;
    el.dataset.n = m[1];
    el.dataset.suf = m[2];
    el.textContent = '0' + m[2];
    countIO.observe(el);
  });

  /* ---------- Scroll progress bar ---------- */
  var bar = document.createElement('div');
  bar.className = 'fx-progress';
  document.body.appendChild(bar);
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      var h = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.transform = 'scaleX(' + (h > 0 ? window.scrollY / h : 0) + ')';
      ticking = false;
    });
  }, { passive: true });
})();
</script>
